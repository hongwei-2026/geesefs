name: RISC-V validation

on:
  workflow_dispatch:
  push:
    branches:
      - verify/riscv64-geesefs

jobs:
  validate:
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Confirm native architecture
        run: test "$(uname -m)" = riscv64
      - name: Test stream redirection
        run: go test -run TestRedirectStandardStreams ./core/cfg
      - name: Build geesefs
        run: CGO_ENABLED=0 go build ./...
